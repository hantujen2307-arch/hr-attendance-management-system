<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Shield / Enterprise Building Emblem -->
  <g transform="translate(106, 96)">
    <!-- Main Card Body -->
    <rect x="20" y="40" width="260" height="260" rx="36" fill="#ffffff" />
    
    <!-- Clock / Check-in Icon inside Card -->
    <!-- Clock Circle -->
    <circle cx="150" cy="150" r="76" fill="#eff6ff" stroke="#2563eb" stroke-width="14" />
    
    <!-- Clock Hands at 08:00 (Check-in time) -->
    <line x1="150" y1="150" x2="150" y2="104" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <line x1="150" y1="150" x2="114" y2="170" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <circle cx="150" cy="150" r="10" fill="#2563eb" />

    <!-- Attendance Verification Checkmark Badge -->
    <g transform="translate(186, 186)">
      <circle cx="44" cy="44" r="44" fill="#10b981" stroke="#ffffff" stroke-width="10" />
      <polyline points="26,44 38,56 62,32" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Title Text at Bottom -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    HR SYSTEM
  </text>
</svg>
